name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Confirm production deployment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  deploy-frontend-production:
    name: Deploy Frontend to Vercel (Production)
    runs-on: ubuntu-latest
    environment:
      name: production-frontend
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Install dependencies
        run: |
          cd shared && npm ci && npm run build
          cd ../frontend && npm ci

      - name: Build Angular app
        run: |
          cd frontend
          npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Vercel
        id: deploy
        run: |
          cd frontend
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes > deployment-url.txt
          echo "url=$(cat deployment-url.txt)" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PRODUCTION }}

      - name: Create deployment tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          timestamp=$(date +%Y%m%d-%H%M%S)
          git tag "deploy-frontend-$timestamp"
          git push origin "deploy-frontend-$timestamp"

      - name: Deployment Complete
        run: echo "🚀 Frontend deployed to production"

  deploy-backend-production:
    name: Backend Deployment (Railway Auto-Deploy)
    runs-on: ubuntu-latest
    environment:
      name: production-backend
    steps:
      - name: Railway Auto-Deploy Triggered
        run: |
          echo "✅ CI passed! Railway will auto-deploy the backend."
          echo "Monitor deployment at: https://railway.app/"

  production-health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: [deploy-frontend-production, deploy-backend-production]
    steps:
      - name: Wait for deployment to stabilize
        run: sleep 60

      - name: Check backend health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.PRODUCTION_BACKEND_URL }}/api/health)
          if [ $response -ne 200 ]; then
            echo "Health check failed with status $response"
            exit 1
          fi
          echo "Backend health check passed"

      - name: Check frontend availability
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.PRODUCTION_FRONTEND_URL }})
          if [ $response -ne 200 ]; then
            echo "Frontend check failed with status $response"
            exit 1
          fi
          echo "Frontend availability check passed"

      - name: Health checks passed
        run: echo "✅ Production deployment successful! All health checks passed."

  rollback-on-failure:
    name: Rollback on Health Check Failure
    runs-on: ubuntu-latest
    needs: [production-health-check]
    if: failure()
    steps:
      - name: Deployment failed
        run: echo "❌ Production deployment failed health checks. Manual rollback may be required."
