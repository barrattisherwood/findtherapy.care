name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Confirm production deployment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  deploy-frontend-production:
    name: Frontend Deployment (Vercel Auto-Deploy)
    runs-on: ubuntu-latest
    environment:
      name: production-frontend
    steps:
      - name: Vercel Auto-Deploy Triggered
        run: |
          echo "✅ CI passed! Vercel will auto-deploy the frontend."
          echo "Monitor deployment at: https://vercel.com/dashboard"

  deploy-backend-production:
    name: Backend Deployment (Railway Auto-Deploy)
    runs-on: ubuntu-latest
    environment:
      name: production-backend
    steps:
      - name: Railway Auto-Deploy Triggered
        run: |
          echo "✅ CI passed! Railway will auto-deploy the backend."
          echo "Monitor deployment at: https://railway.app/"

  production-health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: [deploy-frontend-production, deploy-backend-production]
    steps:
      - name: Wait for deployment to stabilize
        run: sleep 60

      - name: Check frontend availability
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -L https://findtherapy.care)
          if [ $response -ne 200 ]; then
            echo "Frontend check failed with status $response"
            exit 1
          fi
          echo "Frontend availability check passed"

      - name: Check backend health (optional - skip if not deployed)
        continue-on-error: true
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://api.findtherapy.care/api/health)
          if [ $response -ne 200 ]; then
            echo "Backend not available (status $response) - skipping (backend may not be deployed yet)"
          else
            echo "Backend health check passed"
          fi

      - name: Health checks passed
        run: echo "Production deployment successful!"

  rollback-on-failure:
    name: Rollback on Health Check Failure
    runs-on: ubuntu-latest
    needs: [production-health-check]
    if: failure()
    steps:
      - name: Deployment failed
        run: echo "Production deployment failed health checks. Manual rollback may be required."
