name: Deploy to Staging

on:
  push:
    branches: [develop]

jobs:
  deploy-frontend-staging:
    name: Frontend Deployment (Vercel Auto-Deploy)
    runs-on: ubuntu-latest
    environment:
      name: staging-frontend
    steps:
      - name: Vercel Auto-Deploy Triggered
        run: |
          echo "✅ CI passed! Vercel will auto-deploy the frontend."
          echo "Monitor deployment at: https://vercel.com/dashboard"

  deploy-backend-staging:
    name: Backend Deployment (Railway Auto-Deploy)
    runs-on: ubuntu-latest
    environment:
      name: staging-backend
    steps:
      - name: Railway Auto-Deploy Triggered
        run: |
          echo "✅ CI passed! Railway will auto-deploy the backend."
          echo "Monitor deployment at: https://railway.app/"

