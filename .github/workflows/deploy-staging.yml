name: Deploy to Staging

on:
  push:
    branches: [develop]

jobs:
  deploy-frontend-staging:
    name: Deploy Frontend to Vercel (Staging)
    runs-on: ubuntu-latest
    environment:
      name: staging-frontend
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Install dependencies
        run: |
          cd shared && npm ci && npm run build
          cd ../frontend && npm ci

      - name: Build Angular app
        run: |
          cd frontend
          npm run build -- --configuration=production
        env:
          NODE_ENV: production

      - name: Deploy to Vercel
        id: deploy
        run: |
          cd frontend
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes > deployment-url.txt
          echo "url=$(cat deployment-url.txt)" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_STAGING }}

      - name: Comment deployment URL on commit
        uses: actions/github-script@v7
        if: github.event_name == 'push'
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '🚀 Frontend deployed to staging: ${{ steps.deploy.outputs.url }}'
            })

  deploy-backend-staging:
    name: Deploy Backend to Railway (Staging)
    runs-on: ubuntu-latest
    environment:
      name: staging-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: |
          cd backend
          railway up --service backend-staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Comment deployment status on commit
        uses: actions/github-script@v7
        if: github.event_name == 'push'
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '🚀 Backend deployed to Railway staging'
            })

  staging-health-check:
    name: Staging Health Check
    runs-on: ubuntu-latest
    needs: [deploy-frontend-staging, deploy-backend-staging]
    steps:
      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Check backend health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.STAGING_BACKEND_URL }}/api/health)
          if [ $response -ne 200 ]; then
            echo "Health check failed with status $response"
            exit 1
          fi
          echo "Backend health check passed"

      - name: Check frontend availability
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.STAGING_FRONTEND_URL }})
          if [ $response -ne 200 ]; then
            echo "Frontend check failed with status $response"
            exit 1
          fi
          echo "Frontend availability check passed"
