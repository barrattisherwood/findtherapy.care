name: CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - 'package*.json'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]  # Only run on main branch pushes, not develop
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'shared/**'
      - 'package*.json'
      - '.github/workflows/ci.yml'

jobs:
  # Shared packages
  shared-test:
    name: Shared - Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd shared
          npm ci

      - name: Build shared package
        run: |
          cd shared
          npm run build

      - name: Upload shared build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shared-dist
          path: shared/dist/
          retention-days: 1

  # Backend
  backend-lint:
    name: Backend - Lint
    runs-on: ubuntu-latest
    needs: shared-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download shared artifacts
        uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: shared/dist/

      - name: Install dependencies
        run: |
          cd shared && npm ci
          cd ../backend && npm ci

      - name: Run ESLint
        run: |
          cd backend
          npx eslint . --ext .ts --max-warnings 0 || echo "ESLint not configured"

  backend-test:
    name: Backend - Test
    runs-on: ubuntu-latest
    needs: shared-test
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download shared artifacts
        uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: shared/dist/

      - name: Install dependencies
        run: |
          cd shared && npm ci
          cd ../backend && npm ci

      - name: Run tests
        run: |
          cd backend
          npm test -- --forceExit --testTimeout=120000
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci
          MONGODB_URI: mongodb://localhost:27017/test

  backend-build:
    name: Backend - Build
    runs-on: ubuntu-latest
    needs: shared-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download shared artifacts
        uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: shared/dist/

      - name: Install dependencies
        run: |
          cd shared && npm ci
          cd ../backend && npm ci

      - name: Build TypeScript
        run: |
          cd backend
          npx tsc --noEmit

  # Frontend
  frontend-lint:
    name: Frontend - Lint
    runs-on: ubuntu-latest
    needs: shared-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download shared artifacts
        uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: shared/dist/

      - name: Install dependencies
        run: |
          cd shared && npm ci
          cd ../frontend && npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npx eslint . --max-warnings 0 || echo "ESLint not configured"

  frontend-test:
    name: Frontend - Test
    runs-on: ubuntu-latest
    needs: shared-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download shared artifacts
        uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: shared/dist/

      - name: Install dependencies
        run: |
          cd shared && npm ci
          cd ../frontend && npm ci

      - name: Run tests
        run: |
          cd frontend
          npm test -- --no-watch
        env:
          NODE_ENV: test

  frontend-build:
    name: Frontend - Build
    runs-on: ubuntu-latest
    needs: shared-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download shared artifacts
        uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: shared/dist/

      - name: Install dependencies
        run: |
          cd shared && npm ci
          cd ../frontend && npm ci

      - name: Build Angular app
        run: |
          cd frontend
          npm run build -- --configuration=production

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # Summary job
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [shared-test, backend-lint, backend-test, backend-build, frontend-lint, frontend-test, frontend-build]
    steps:
      - name: CI Passed
        run: echo "All CI checks passed successfully!"
