[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[envVars]]
name = "NODE_ENV"
value = "production"

[[envVars]]
name = "PORT"
value = "3000"

[services.backend-production]
source = "backend"
region = "us-west1"
