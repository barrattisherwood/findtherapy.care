[build]
builder = "NIXPACKS"
buildCommand = "cd shared && npm ci --engine-strict=false --cache /tmp/npm-cache && npm run build && cd ../backend && npm ci --engine-strict=false --cache /tmp/npm-cache && npx tsc"

[deploy]
startCommand = "node backend/dist/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[envVars]]
name = "NODE_ENV"
value = "production"

[[envVars]]
name = "PORT"
value = "3000"

[[envVars]]
name = "NIXPACKS_NO_CACHE"
value = "1"

[services.backend-production]
source = "backend"
region = "us-west1"
