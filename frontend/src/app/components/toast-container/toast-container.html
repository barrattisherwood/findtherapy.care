<div class="fixed top-4 right-4 z-50 space-y-2 max-w-sm">
  @for (toast of toasts(); track toast.id) {
    <div
      class="border-l-4 rounded-lg shadow-lg p-4 flex items-start gap-3"
      [ngClass]="[
        getStyles(toast.type),
        isClosing(toast.id) ? 'animate-slide-out' : 'animate-slide-in'
      ]"
    >
      <div
        class="flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-sm font-bold"
        [ngClass]="getIconStyles(toast.type)"
      >
        {{ getIcon(toast.type) }}
      </div>

      <div class="flex-1 min-w-0">
        <h4 class="font-semibold text-sm">{{ toast.title }}</h4>
        <p class="text-sm opacity-90 mt-0.5">{{ toast.message }}</p>
      </div>

      <button
        (click)="dismiss(toast.id)"
        class="flex-shrink-0 opacity-50 hover:opacity-100 transition-opacity"
      >
        ✕
      </button>
    </div>
  }
</div>
