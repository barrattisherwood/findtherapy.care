<div class="image-upload-container">
  <!-- Preview area or upload zone -->
  @if (previewUrl()) {
    <div class="preview-container">
      <img [src]="previewUrl()" alt="Profile preview" class="preview-image" />

      @if (!uploading) {
        <div class="preview-overlay">
          <button
            type="button"
            (click)="triggerFileInput()"
            class="btn-change"
          >
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
            </svg>
            Change
          </button>
          <button
            type="button"
            (click)="removeImage()"
            class="btn-remove"
          >
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
            </svg>
            Remove
          </button>
        </div>
      }

      @if (uploading) {
        <div class="uploading-overlay">
          <div class="spinner"></div>
          <p class="uploading-text">Uploading...</p>
        </div>
      }
    </div>
  } @else {
    <div
      class="upload-zone"
      [class.drag-over]="dragOver()"
      (click)="triggerFileInput()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
    >
      @if (uploading) {
        <div class="spinner"></div>
        <p class="upload-text">Uploading...</p>
      } @else {
        <svg class="upload-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
        </svg>
        <p class="upload-text">Drop your image here or click to browse</p>
        <p class="upload-hint">Recommended: 800x800px square image, max 5MB</p>
      }
    </div>
  }

  <!-- Hidden file input -->
  <input
    type="file"
    id="imageInput"
    accept="image/*"
    (change)="onFileSelected($event)"
    class="hidden"
  />
</div>
