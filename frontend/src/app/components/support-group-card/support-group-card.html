<a [routerLink]="['/support-groups', supportGroup.id]" class="block bg-white rounded-lg shadow hover:shadow-md transition-shadow p-6">
  <div class="flex justify-between items-start mb-3">
    <h3 class="text-lg font-semibold text-gray-900">{{ supportGroup.name }}</h3>
    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium" [class]="meetingTypeColor">
      {{ meetingTypeLabel }}
    </span>
  </div>

  <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-accent-100 text-accent-800 mb-3">
    {{ supportGroup.category }}
  </span>

  @if (locationDisplay) {
    <p class="text-sm text-gray-500 mb-3">{{ locationDisplay }}</p>
  }

  <p class="text-gray-600 text-sm mb-4 line-clamp-2">{{ supportGroup.description }}</p>

  @if (supportGroup.meetingSchedule) {
    <div class="flex items-center text-sm text-gray-600">
      <svg class="w-4 h-4 mr-1.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      {{ supportGroup.meetingSchedule }}
    </div>
  }
</a>
