<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-8">
  <div class="max-w-md w-full space-y-8">
    <div>
      <h2 class="text-center text-2xl sm:text-3xl font-bold text-gray-900">
        Reset Password
      </h2>
      <p class="mt-2 text-center text-sm sm:text-base text-gray-600">
        Enter your new password below
      </p>
    </div>

    <form class="mt-8 space-y-6" (ngSubmit)="onSubmit()">
      <div class="space-y-4">
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">
            New Password
          </label>
          <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="password"
            required
            class="mt-1 block w-full px-4 py-2.5 sm:py-3 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm sm:text-base transition-colors"
            placeholder="At least 6 characters"
          />
        </div>

        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700">
            Confirm Password
          </label>
          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            [(ngModel)]="confirmPassword"
            required
            class="mt-1 block w-full px-4 py-2.5 sm:py-3 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm sm:text-base transition-colors"
            placeholder="Confirm your password"
          />
        </div>
      </div>

      @if (error()) {
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
          {{ error() }}
        </div>
      }

      @if (success()) {
        <div class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg text-sm">
          {{ success() }}
          <p class="mt-1 text-xs">Redirecting to login...</p>
        </div>
      }

      <button
        type="submit"
        [disabled]="loading() || !token"
        class="w-full bg-primary-600 text-white py-3 px-4 rounded-lg hover:bg-primary-700 active:bg-primary-800 disabled:opacity-50 disabled:cursor-not-allowed transition-colors font-medium shadow-sm"
      >
        {{ loading() ? 'Resetting...' : 'Reset Password' }}
      </button>

      <div class="text-center text-sm">
        <a routerLink="/login" class="text-primary-500 hover:text-primary-600 font-medium">
          Back to Sign in
        </a>
      </div>
    </form>
  </div>
</div>
