<nav class="bg-white shadow-sm border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div class="flex items-center">
        <a routerLink="/" class="flex items-center gap-2">
          <svg class="w-7 h-7 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
          </svg>
          <span class="text-lg sm:text-xl font-bold text-primary-600">findlocal.care</span>
        </a>
      </div>

      <!-- Navigation Links -->
      @if (isAuthenticated()) {
        <!-- Desktop Navigation -->
        <div class="hidden md:flex items-center gap-6">
          <a
            routerLink="/dashboard"
            routerLinkActive="text-primary-600 font-semibold"
            [routerLinkActiveOptions]="{exact: false}"
            class="text-gray-700 hover:text-primary-600 transition-colors"
          >
            Dashboard
          </a>

          <!-- User Menu -->
          <div class="flex items-center gap-3">
            <div class="text-sm text-right">
              <div class="font-medium text-gray-900">{{ currentUser()?.username }}</div>
            </div>
            <button
              (click)="logout()"
              class="text-sm text-gray-600 hover:text-gray-900 transition-colors"
            >
              Logout
            </button>
          </div>
        </div>

        <!-- Mobile Navigation -->
        <div class="flex md:hidden items-center gap-2">
          <!-- Mobile Menu Button -->
          <button
            (click)="toggleMobileMenu()"
            class="mobile-menu-trigger p-2 text-gray-500 hover:text-primary-600"
          >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
        </div>

        <!-- Mobile Menu Dropdown -->
        @if (showMobileMenu) {
          <div class="fixed inset-0 bg-black/20 z-40 md:hidden" (click)="toggleMobileMenu()"></div>
          <div class="mobile-menu fixed inset-x-0 top-16 mx-4 bg-white rounded-lg shadow-lg border border-gray-200 z-50 md:hidden">
            <div class="p-4 space-y-1">
              <!-- User Info -->
              <div class="pb-3 mb-3 border-b border-gray-200">
                <div class="font-medium text-gray-900">{{ currentUser()?.username }}</div>
                <div class="text-xs text-gray-500">{{ currentUser()?.email }}</div>
              </div>

              <!-- Menu Items -->
              <a
                routerLink="/dashboard"
                (click)="toggleMobileMenu()"
                routerLinkActive="bg-primary-50 text-primary-600 font-semibold"
                class="flex items-center gap-3 py-3 px-3 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/>
                </svg>
                <span>Dashboard</span>
              </a>

              <hr class="my-2 border-gray-200">

              <button
                (click)="logout()"
                class="flex items-center gap-3 w-full py-3 px-3 rounded-lg text-gray-600 hover:bg-gray-50 transition-colors"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
                <span>Logout</span>
              </button>
            </div>
          </div>
        }

      } @else {
        <div class="flex items-center gap-2 sm:gap-4">
          <a
            routerLink="/login"
            class="text-gray-700 hover:text-primary-600 transition-colors text-sm sm:text-base"
          >
            Login
          </a>
          <a
            routerLink="/register"
            class="px-3 py-2 sm:px-4 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors text-sm sm:text-base whitespace-nowrap"
          >
            Sign Up
          </a>
        </div>
      }
    </div>
  </div>
</nav>
